name: One-time v0.2.8 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v028-once.yml']
permissions:
  contents: read
concurrency:
  group: release-v028-once
  cancel-in-progress: false
jobs:
  release:
    if: github.event.head_commit.message == 'Publish v0.2.8 once with user authorization'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b726a42be1d96c42b66f5a2291763318b43efcdd
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test published source
        run: node --test test/*.test.mjs
      - name: Build and check release
        run: |
          python3 scripts/package-release.py
          python3 - <<'PY'
          import zipfile, pathlib, re, hashlib, json
          p = pathlib.Path('../chaoxing-agent-0.2.8.zip')
          with zipfile.ZipFile(p) as src:
              files = { 'chaoxing-agent/' + n.split('/', 1)[1]: src.read(n) for n in src.namelist() }
          with zipfile.ZipFile(p, 'w', compression=zipfile.ZIP_DEFLATED) as dst:
              for n, b in files.items():
                  dst.writestr(n, b)
          with zipfile.ZipFile(p, 'a', compression=zipfile.ZIP_DEFLATED) as z:
              z.write('LICENSE', 'chaoxing-agent/LICENSE')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              m = json.loads(z.read('chaoxing-agent/release-files.json'))
              assert m['version'] == '0.2.8'
              for n in z.namelist():
                  rel = n.split('/', 1)[1]
                  assert 'data' not in pathlib.PurePosixPath(rel).parts
                  assert rel != '.env'
                  assert not pathlib.PurePosixPath(rel).name.startswith('live-')
                  assert not rel.endswith('.png')
                  b = z.read(n)
                  assert not re.search(rb'(?:sk-[A-Za-z0-9_-]{24,}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,})', b)
                  assert not any(s in b for s in [b'494662647', b'152702811', b'265680874', b'C:\\Users\\dianb'])
                  if rel in m['files']:
                      assert hashlib.sha256(b).hexdigest() == m['files'][rel]['sha256']
          pathlib.Path('../SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n')
          PY
      - name: Publish v0.2.8 only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          学习通本地 Agent v0.2.8

          - 浏览器扩展与本机 Node.js 服务，支持配置 AI 后端。
          - 课程任务识别、练习辅助、讨论回复及章节导航。
          - 58 项单元测试通过；不代表全部真实课程已验证。

          下载 ZIP 解压，Windows 运行 start.cmd，再在 Chrome 加载 extension 目录。
          需要 Node.js 22+；默认使用本机已登录的 Codex CLI，也可配置兼容 API。
          [安装与部署文档](https://github.com/lfu45757-star/ChaoXin-XueXiTong/blob/b726a42be1d96c42b66f5a2291763318b43efcdd/DEPLOYMENT.md)

          从已发布源码构建，排除 .env、data/、课程截图和 live-* 记录，不读取本机令牌或密钥。
          SHA256SUMS.txt 提供 ZIP 校验值。
          EOF
          if gh release view v0.2.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists; refusing to replace it."
            exit 1
          fi
          gh release create v0.2.8 ../chaoxing-agent-0.2.8.zip ../SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target b726a42be1d96c42b66f5a2291763318b43efcdd --title "v0.2.8 · 学习通本地 Agent" --notes-file /tmp/release-notes.md

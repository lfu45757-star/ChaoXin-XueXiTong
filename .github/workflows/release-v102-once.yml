name: One-time v1.0.2 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v102-once.yml']
permissions:
  contents: read
concurrency:
  group: release-v102-once
  cancel-in-progress: false
jobs:
  release:
    if: github.event.head_commit.message == 'Publish v1.0.2 once with user authorization'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a9218b4cb9d0913ee4b62ac471a955871d9ff165
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test source
        run: node --test test/*.test.mjs
      - name: Build and audit
        run: |
          python3 -c "import json; assert json.load(open('package.json'))['version'] == '1.0.2'"
          python3 scripts/package-release.py
          python3 scripts/verify-release.py
      - name: Publish v1.0.2 only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          学习通本地 Agent v1.0.2。

          - 音频任务点默认在时长加载后自动跳到结尾，可在扩展设置中关闭。
          - 后台托管时防止课程标签页被自动丢弃；通过定时心跳检测播放停滞并尝试恢复进度。
          - 浏览器首次阻止自动播放时，仍需在页面点击一次播放按钮。
          - 61 项单元测试与 10 个隔离浏览器媒体场景通过；尚需在真实后台播放环境中验证。

          安装：下载 ZIP 解压，Windows 运行 start.cmd，在 Chrome 或 Edge 加载 extension 文件夹。
          升级：停止托管，保留本机 .env 和 data，更新代码并重启服务，在扩展管理页重新加载，再刷新课程页；扩展和服务版本均应为 1.0.2。
          [完整部署文档](https://github.com/lfu45757-star/ChaoXin-XueXiTong/blob/a9218b4cb9d0913ee4b62ac471a955871d9ff165/DEPLOYMENT.md)

          安装包从固定源码提交构建，排除 .env、data/、课程截图和 live-* 记录。附带 SHA-256 校验文件；包内 release-files.json 包含逐文件校验信息。
          EOF
          if gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists; refusing replacement."
            exit 1
          fi
          gh release create v1.0.2 ../chaoxing-agent-1.0.2.zip ../chaoxing-agent-1.0.2.sha256 --repo "$GITHUB_REPOSITORY" --target a9218b4cb9d0913ee4b62ac471a955871d9ff165 --title "v1.0.2 · 学习通本地 Agent" --notes-file /tmp/release-notes.md

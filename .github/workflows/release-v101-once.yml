name: One-time v1.0.1 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v101-once.yml']
permissions:
  contents: read
concurrency:
  group: release-v101-once
  cancel-in-progress: false
jobs:
  release:
    if: github.event.head_commit.message == 'Publish v1.0.1 once with user authorization'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3279293b211b3fcb522a7882ecd8897db1818a86
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test source
        run: node --test test/*.test.mjs
      - name: Build and audit
        run: |
          python3 -c "import json; assert json.load(open('package.json'))['version'] == '1.0.1'"
          python3 scripts/package-release.py
          python3 scripts/verify-release.py
      - name: Publish v1.0.1 only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          学习通本地 Agent v1.0.1，基于本地 0.2.15 整合发布。

          - Chrome 与 Edge 使用同一份 Manifest V3 扩展。
          - 整合跨源 PDF 阅读器、无任务点章节导航、英文填空标签识别及章节测验确认处理。
          - 59 项单元测试通过；本地 Edge 隔离环境通过扩展加载、34 个导航场景和 8 项 PDF 桥接检查。
          - 测试未向真实课程提交，不代表所有课程模板均已验证。

          安装：下载 ZIP 解压，Windows 运行 start.cmd，再在 Chrome 或 Edge 加载 extension 文件夹。
          升级：停止托管，保留本机 .env 和 data，更新代码并重启服务，在扩展管理页重新加载，再刷新课程页；扩展和服务版本均应为 1.0.1。
          [完整部署文档](https://github.com/lfu45757-star/ChaoXin-XueXiTong/blob/3279293b211b3fcb522a7882ecd8897db1818a86/DEPLOYMENT.md)

          安装包从固定源码提交构建，不读取用户电脑数据，排除 .env、data/、课程截图和 live-* 记录。
          附带 SHA-256 校验文件；内部 release-files.json 包含逐文件校验信息。
          EOF
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists; refusing replacement."
            exit 1
          fi
          gh release create v1.0.1 ../chaoxing-agent-1.0.1.zip ../chaoxing-agent-1.0.1.sha256 --repo "$GITHUB_REPOSITORY" --target 3279293b211b3fcb522a7882ecd8897db1818a86 --title "v1.0.1 · 学习通本地 Agent" --notes-file /tmp/release-notes.md
